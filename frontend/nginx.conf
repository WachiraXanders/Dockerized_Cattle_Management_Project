server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # The service worker and manifest must never be cached long-term, or
    # updates (new icons, new caching rules) won't reach installed PWAs.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unmatched path serves index.html so client-side
    # routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
